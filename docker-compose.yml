###############################################################################
# Vigilia — Docker Compose (Production-Ready Base)
# Servicios: modelo_IA, backend, frontend, postgres, mongodb, redis,
#            rabbitmq, minio
###############################################################################

services:
  # =========================================================================
  # 🧠  CORE / INTELIGENCIA ARTIFICIAL
  # =========================================================================
  modelo-ia:
    build:
      context: ./modelo_IA
      dockerfile: Dockerfile
    container_name: vigilia-modelo-ia
    restart: unless-stopped
    # Pipeline S1..S9 + Visualizador Byrack (python main_orchestrator.py).
    # Camara: IP/RTSP configurada en modelo_IA/.env (RTSP_URL, RTSP_USER,
    # RTSP_PASSWORD). No se mapea /dev/video0: la camara llega por red.
    ports:
      - "${IA_PORT:-8001}:8001"        # Visualizador: /stream, /snapshot.jpg, /api/state, /health
      - "${ALERT_PORT:-8080}:8080"     # Servicio de alertas (UI de pruebas)
    volumes:
      - ./modelo_IA:/app
      - ia-models:/app/models          # Persistir modelos YOLO descargados
      - minio-data:/shared/minio       # Acceso compartido a almacenamiento
    env_file:
      - .env
      - ./modelo_IA/.env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - VISUALIZER_HOST=0.0.0.0        # dentro del contenedor; el host solo expone los puertos mapeados
      - VISUALIZER_PORT=8001
      - ALERT_HOST=0.0.0.0
      - ALERT_PORT=8080
      - ALERT_OPEN_BROWSER=false       # no hay navegador dentro del contenedor
    # Tiempo para cerrar los clips de evidencia en curso al detener.
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - vigilia-net
    # Descomentar si tienes GPU NVIDIA:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # =========================================================================
  # ⚙️  BACKEND — FastAPI
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vigilia-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - vigilia-net

  # =========================================================================
  # 🎨  FRONTEND — React + Vite + TypeScript
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vigilia-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules   # Evitar conflictos OS
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - vigilia-net

  # =========================================================================
  # 📦  INFRAESTRUCTURA
  # =========================================================================

  # ---- PostgreSQL ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: vigilia-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vigilia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigilia_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vigilia_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vigilia}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vigilia-net

  # ---- MongoDB ---------------------------------------------------------------
  mongodb:
    image: mongo:7
    container_name: vigilia-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-vigilia}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-vigilia_secret}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-vigilia_db}
    volumes:
      - mongodb-data:/data/db
    networks:
      - vigilia-net

  # ---- Redis -----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: vigilia-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-vigilia_secret}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-vigilia_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vigilia-net

  # ---- RabbitMQ --------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: vigilia-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-vigilia}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-vigilia_secret}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - vigilia-net

  # ---- MinIO (Object Storage) -----------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: vigilia-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-vigilia}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-vigilia123}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - vigilia-net

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres-data:
    driver: local
  mongodb-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  minio-data:
    driver: local
  ia-models:
    driver: local
  frontend-node-modules:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  vigilia-net:
    driver: bridge
    name: vigilia-net
